<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Stock - LEO Mobile</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/mobile.css?v=3">
    <!-- Firebase SDK Mapping -->
    <script type="importmap">
        {
          "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
            "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
          }
        }
    </script>
    <script>window.onerror = function (m, u, l) { alert("Error: " + m + " at " + u + ":" + l); };</script>
    <style>
        :root {
            --primary: #781d26 !important;
            --bg-app: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%) !important;
        }

        body {
            background: var(--bg-app) !important;
            color: #1d1d1f !important;
        }
    </style>
</head>

<body>
    <div class="calc-container">
        <!-- Top Display Screen -->
        <div class="calc-display">
            <div class="header-row">
                <a href="index.html" class="back-link"><i class="fa-solid fa-chevron-left"></i> Back</a>
                <span id="user-initials">--</span>
            </div>

            <div class="output-group">
                <label id="item-label-display">ITEM</label>
                <div id="m-name"
                    style="font-size:1.5rem; border-bottom:1px solid rgba(120, 29, 38, 0.1); padding-bottom:0.5rem; color:var(--text-main); font-weight:700;">
                    Loading...</div>
                <div style="font-size:0.8rem; color:var(--text-muted); margin-top:0.25rem;">Current Stock: <span
                        id="current-stock" style="font-weight:700; color:var(--primary);">0</span></div>
            </div>

            <div class="output-group main-qty">
                <label>Add Amount (Shift)</label>
                <div class="qty-control">
                    <button class="qty-btn" id="btn-minus"><i class="fa-solid fa-minus"></i></button>
                    <input type="number" id="m-qty" value="1" inputmode="numeric">
                    <button class="qty-btn" id="btn-plus"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
        </div>

        <!-- Control Pad -->
        <div class="calc-pad">
            <label class="pad-label">Reason for Movement</label>
            <div class="unit-grid" style="grid-template-columns: 1fr 1fr;">
                <button class="unit-btn active" data-reason="Donation" data-type="incoming">
                    <i class="fa-solid fa-hand-holding-heart"></i> Donation (In)
                </button>
                <button class="unit-btn" data-reason="Purchase" data-type="incoming">
                    <i class="fa-solid fa-cart-shopping"></i> Purchase (In)
                </button>
                <button class="unit-btn" data-reason="Distribution" data-type="outgoing">
                    <i class="fa-solid fa-box-open"></i> Distribution (Out)
                </button>
                <button class="unit-btn" data-reason="Correction" data-type="adjustment">
                    <i class="fa-solid fa-pen-to-square"></i> Correction
                </button>
            </div>

            <!-- Numpad / Actions -->
            <div class="action-area" style="margin-top:auto;">
                <button class="action-btn secondary" onclick="window.location.href='index.html'">
                    Cancel
                </button>
                <button class="action-btn primary" id="btn-save">
                    <i class="fa-solid fa-check"></i> UPDATE STOCK
                </button>
            </div>
        </div>
    </div>

    <!-- Success Toast -->
    <div id="toast" class="toast hidden">
        <i class="fa-solid fa-circle-check"></i>
        <span>Stock Updated!</span>
    </div>

    <script type="module" src="js/mobile-update.js"></script>
</body>

</html>
