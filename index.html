<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO Club Curubis Korba - Stock Management</title>
    <link rel="icon" type="image/png" href="img/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-icon" style="background: none; padding: 0;">
                    <img src="img/logo.png" alt="LEO Logo" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <h1>LEO Club<br><span>Curubis Korba</span></h1>
            </div>

            <div class="user-profile">
                <div class="avatar">AD</div>
                <div class="user-info">
                    <p class="name">Admin User</p>
                    <p class="role">Administrator</p>
                </div>
                <div class="user-actions" style="display: flex; gap: 0.25rem;">
                    <button class="switch-btn" id="switch-account-btn" title="Switch Account"><i
                            class="fa-solid fa-user-gear"></i></button>
                    <button class="logout-btn" title="Sign Out"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>

            <nav class="nav-menu">
                <a href="#dashboard" class="nav-item active" data-page="dashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <div class="nav-group">
                    <a href="#stock-impact" class="nav-item" data-page="stock-impact">
                        <i class="fa-solid fa-calculator"></i>
                        <span>Impact Calc</span>
                    </a>
                    <a href="#stock-items" class="nav-item" data-page="stock-items">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        <span>Items</span>
                    </a>
                    <a href="#stock-movements" class="nav-item" data-page="stock-movements">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                        <span>Movements</span>
                    </a>
                </div>
                <a href="#gallery" class="nav-item" data-page="gallery">
                    <i class="fa-solid fa-camera-retro"></i>
                    <span>Gallery</span>
                </a>
                <a href="#reports" class="nav-item" data-page="reports">
                    <i class="fa-solid fa-file-contract"></i>
                    <span>Reports</span>
                </a>
                <a href="#users" class="nav-item" data-page="users">
                    <i class="fa-solid fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="#settings" class="nav-item" data-page="settings">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle" id="menu-toggle">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 id="page-title">Dashboard</h2>
                <div class="actions">
                    <div class="lang-selector">
                        <select id="lang-switch">
                            <option value="en">EN</option>
                            <option value="fr">FR</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="quick-add-btn">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </header>

            <div id="page-content" class="content-area">
                <!-- Dynamic Content Loads Here -->
            </div>
        </main>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Scripts -->
    <!-- Firebase SDK (Modular) -->
    <script type="importmap">
        {
          "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
            "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
          }
        }
    </script>

    <script type="module" src="js/app.js"></script>
</body>

</html>
